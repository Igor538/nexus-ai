services:
  - type: web
    name: nexus-api
    runtime: docker
    plan: free
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: EXECUTION_MODE
        value: inline
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexus-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: AI_DEFAULT_PROVIDER
        value: gemini
      - key: AI_DEFAULT_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

  - type: keyvalue
    name: nexus-redis
    plan: free
    ipAllowList: []

databases:
  - name: nexus-db
    plan: free
    databaseName: nexus
    user: nexus
