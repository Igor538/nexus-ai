x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgresql+psycopg://nexus:nexus_dev_password@postgres:5432/nexus
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # O container da API roda `alembic upgrade head` no start.
  AUTO_CREATE_TABLES: "false"
  EXECUTION_MODE: celery
  EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-300}
  EXECUTION_MAX_STEPS: ${EXECUTION_MAX_STEPS:-200}
  EXECUTION_MAX_OUTPUT_BYTES: ${EXECUTION_MAX_OUTPUT_BYTES:-262144}
  NODE_DEFAULT_MAX_ATTEMPTS: ${NODE_DEFAULT_MAX_ATTEMPTS:-1}
  MAX_ACTIVE_EXECUTIONS_PER_WORKFLOW: ${MAX_ACTIVE_EXECUTIONS_PER_WORKFLOW:-1}
  HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
  HTTP_MAX_RESPONSE_BYTES: ${HTTP_MAX_RESPONSE_BYTES:-1000000}
  HTTP_ALLOW_PRIVATE_NETWORKS: ${HTTP_ALLOW_PRIVATE_NETWORKS:-false}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
  WEBHOOK_RATE_LIMIT_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_PER_MINUTE:-60}
  WEBHOOK_MAX_BODY_BYTES: ${WEBHOOK_MAX_BODY_BYTES:-262144}
  WEBHOOK_SIGNATURE_TOLERANCE_SECONDS: ${WEBHOOK_SIGNATURE_TOLERANCE_SECONDS:-300}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:8000}
  AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-gemini}
  AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-gemini-2.0-flash}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
  AI_AGENT_MAX_ITERATIONS: ${AI_AGENT_MAX_ITERATIONS:-5}
  AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-90}
  AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-200000}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@nexus.local}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-api
    ports:
      - "8000:8000"
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-worker
    command: ["celery", "-A", "app.worker.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-beat
    command: ["celery", "-A", "app.worker.celery_app.celery_app", "beat", "--loglevel=INFO"]
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

